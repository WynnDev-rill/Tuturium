name: Focused narration, keyboard and library tests
on:
  push:
    branches: [verify/narration-1-3-19]
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 81a5befd045bd9ccd3cd7bee42bccfff95dd62b7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            if ! ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=id.tuturium.app.ReaderFlowTest,id.tuturium.app.LibraryV2FlowTest,id.tuturium.app.OfflineVoiceRuntimeTest -Pandroid.testInstrumentationRunnerArguments.offlineVoiceSmoke=true; then
              adb logcat -d -s AndroidRuntime:E TuturiumPlayback:V TuturiumVoice:V
              python3 -c 'from pathlib import Path; from xml.etree import ElementTree as E; print(*[f.text for p in Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml") for f in E.parse(p).iter("failure")],sep="\n")'
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-regression-evidence
          path: app/build/outputs/androidTest-results/
