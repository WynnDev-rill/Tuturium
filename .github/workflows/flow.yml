name: Verify Supertonic accelerated estimator
on:
  push:
    branches: [verify/supertonic-1-3-23]
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b960af111366f048647d0f416288f87015dcce5c
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            bash -c 'adb shell settings put secure show_ime_with_hard_keyboard 1;
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=id.tuturium.app.OfflineVoiceRuntimeTest -Pandroid.testInstrumentationRunnerArguments.offlineVoiceSmoke=true;
            result=$?; adb logcat -d -s TuturiumVoiceBenchmark:I TuturiumSupertonic:I; if [ "$result" -ne 0 ]; then adb logcat -d -s AndroidRuntime:E TuturiumPlayback:V TuturiumVoice:V;
            find app/build/outputs/androidTest-results -name "TEST-*.xml" -exec sed -n "/<failure/,/<\/failure>/p" {} +; fi;
            exit "$result"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supertonic-estimator-evidence
          path: app/build/outputs/androidTest-results/
