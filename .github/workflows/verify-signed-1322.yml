name: Verify and stage Tuturium 1.3.22
on:
  push:
    branches: [verify/signed-1-3-22]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify certificate, SHA-256 and alignment
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          sha256sum --check Tuturium.apk.sha256
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/apksigner" verify --verbose --print-certs Tuturium.apk | tee certificate.txt
          grep -Ff signing-certificate.sha256 certificate.txt
          "$sdk/zipalign" -c -P 16 4 Tuturium.apk
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash verify-upgrade.sh
      - name: Stage verified assets on the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.3.22 Tuturium.apk Tuturium.apk.sha256 --clobber
