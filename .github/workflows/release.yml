name: Signed Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      TUTURIUM_STORE_PASSWORD: ${{ secrets.TUTURIUM_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve automatic version on main
        id: version
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)
          echo "TAG=v$version" >> "$GITHUB_ENV"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Android SDK packages
        if: steps.version.outputs.skip != 'true'
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Validate the tag and existing releases
        if: steps.version.outputs.skip != 'true'
        run: scripts/check-release.sh "$TAG"
      - name: Load the release keystore
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TUTURIUM_KEYSTORE_BASE64 }}
        run: |
          umask 077
          if [[ -z "$KEYSTORE_BASE64" || -z "$TUTURIUM_STORE_PASSWORD" ]]; then
            echo "::error::Both TUTURIUM_KEYSTORE_BASE64 and TUTURIUM_STORE_PASSWORD must be configured as GitHub Actions secrets."
            exit 1
          fi
          keystore="$RUNNER_TEMP/tuturium.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # The private backup may have been configured as a ZIP rather than a .p12.
          magic=$(od -An -tx1 -N4 "$keystore" | tr -d ' \\n')
          if [[ "$magic" == "504b0304" ]]; then
            echo "Signing key format: ZIP backup"
            mv "$keystore" "$RUNNER_TEMP/tuturium-signing-source.zip"
            unzip -p "$RUNNER_TEMP/tuturium-signing-source.zip" Tuturium.p12 > "$keystore"
          elif [[ "$magic" == 30* ]]; then
            echo "Signing key format: PKCS#12"
          else
            echo "::error::Signing secret is not a PKCS#12 keystore or an expected ZIP backup."
            exit 1
          fi
          # Do not log key material or the password, even if validation fails.
          if ! keytool -list -storetype PKCS12 -keystore "$keystore" \
            -storepass:env TUTURIUM_STORE_PASSWORD -alias tuturium >/dev/null 2>&1; then
            echo "::error::Signing key cannot be unlocked. Verify that both GitHub Actions secrets belong to the same signing ZIP."
            exit 1
          fi
          echo "Signing alias: verified"
          echo "TUTURIUM_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Verify and assemble
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Verify signer and publish
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Tuturium.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Tuturium.apk | tee dist/certificate.txt
          grep -Ff docs/signing-certificate.sha256 dist/certificate.txt
          (cd dist && sha256sum Tuturium.apk > Tuturium.apk.sha256)
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --verify-tag --draft --title "Tuturium ${TAG#v}" --notes-file docs/release-notes.md dist/Tuturium.apk dist/Tuturium.apk.sha256
          gh release edit "$TAG" --draft=false --latest
      - name: Remove the runner keystore
        if: always()
        run: |
          for file in "$RUNNER_TEMP/tuturium.p12" "$RUNNER_TEMP/tuturium-signing-source.zip"; do
            if [ -f "$file" ]; then unlink "$file"; fi
          done
