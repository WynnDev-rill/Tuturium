name: Export unsigned Tuturium release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned APK
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Prepare safe local-signing bundle
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*unsigned.apk' -print -quit)
          test -n "$apk"
          cp "$apk" dist/Tuturium-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 dist/Tuturium-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tuturium-unsigned-release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 2
